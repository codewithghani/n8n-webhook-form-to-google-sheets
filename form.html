<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; padding: 40px 16px; }
    form { background: #fff; padding: 24px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 100px; resize: vertical; }
    button { background: #ff6d5a; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Replace the action URL with YOUR n8n Production Webhook URL -->
  <form action="https://YOUR-N8N-INSTANCE/webhook/form-submit" method="POST">
    <h2>Contact Us</h2>
    <input name="name" placeholder="Your name" required>
    <input name="email" type="email" placeholder="Email" required>
    <textarea name="message" placeholder="Message"></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
